<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Mate 🎯</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bounce-dot { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-10px)} }
    @keyframes pulse-timer { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.93)} }
    @keyframes fade-in     { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes shake       { 0%,100%{transform:rotate(0deg) scale(1)} 15%{transform:rotate(-8deg) scale(1.05)} 30%{transform:rotate(8deg) scale(1.05)} 45%{transform:rotate(-6deg) scale(1.05)} 60%{transform:rotate(6deg) scale(1.05)} 75%{transform:rotate(-4deg) scale(1.02)} }
    @keyframes pop         { 0%{transform:scale(0) rotate(-10deg);opacity:0} 65%{transform:scale(1.15) rotate(3deg);opacity:1} 100%{transform:scale(1) rotate(0deg);opacity:1} }
    @keyframes float       { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-8px)} }
    @keyframes slide-in    { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:translateX(0)} }
    .dot   {width:10px;height:10px;border-radius:50%;background:#a78bfa;display:inline-block;margin:0 3px}
    .d1{animation:bounce-dot 1.2s ease-in-out 0s infinite}
    .d2{animation:bounce-dot 1.2s ease-in-out .2s infinite}
    .d3{animation:bounce-dot 1.2s ease-in-out .4s infinite}
    .blink   {animation:pulse-timer .65s ease-in-out infinite}
    .fade    {animation:fade-in .35s ease}
    .shake   {animation:shake 1.2s ease-in-out infinite}
    .pop     {animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
    .float   {animation:float 2s ease-in-out infinite}
    .slide-in{animation:slide-in .3s ease}
    *{-webkit-tap-highlight-color:transparent}
  </style>
</head>
<body class="bg-gray-900">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [phase,          setPhase         ] = useState('home');   // home | pregame | lobby | playing | result | error
  const [homeTab,        setHomeTab       ] = useState('create'); // create | join
  const [nameInput,      setNameInput     ] = useState('');
  const [codeInput,      setCodeInput     ] = useState('');

  const [myName,         setMyName        ] = useState('');
  const [isHost,         setIsHost        ] = useState(false);
  const [roomCode,       setRoomCode      ] = useState('');
  const [hostName,       setHostName      ] = useState('');
  const [pregamePlayers, setPregamePlayers] = useState([]);
  const [lobbyCount,     setLobbyCount    ] = useState(0);
  const [codeCopied,     setCodeCopied    ] = useState(false);

  const [myObject,       setMyObject      ] = useState(null);
  const [myGameCode,     setMyGameCode    ] = useState('');
  const [oppLabel,       setOppLabel      ] = useState('');
  const [oppMatched,     setOppMatched    ] = useState(false);
  const [myMatched,      setMyMatched     ] = useState(false);
  const [verifyInput,    setVerifyInput   ] = useState('');
  const [timeLeft,       setTimeLeft      ] = useState(120);
  const [gameOn,         setGameOn        ] = useState(false);
  const [round,          setRound         ] = useState(0);

  const [result,         setResult        ] = useState(null);
  const [revealed,       setRevealed      ] = useState(false);
  const [attemptsLeft,   setAttemptsLeft  ] = useState(3);
  const [fb,             setFb            ] = useState({ msg:'', type:'' });
  const [errMsg,         setErrMsg        ] = useState('');

  const wsRef    = useRef(null);
  const countRef = useRef(null);

  const reconnectTimerRef = useRef(null);

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}`);
    wsRef.current = ws;
    ws.onopen = () => {
      clearTimeout(reconnectTimerRef.current);
    };
    ws.onclose = () => {
      setPhase(p => {
        if (p === 'home') return 'home';
        // Mid-game disconnect — show reconnecting screen then reload
        reconnectTimerRef.current = setTimeout(() => location.reload(), 4000);
        return 'reconnecting';
      });
    };
    ws.onerror = () => {};
    ws.onmessage = (e) => handle(JSON.parse(e.data));
  }

  useEffect(() => {
    connect();
    // Pre-fill join code if URL has ?join=CODE
    const joinParam = new URLSearchParams(window.location.search).get('join');
    if (joinParam) {
      setHomeTab('join');
      setCodeInput(joinParam.toUpperCase());
    }
    return () => {
      clearTimeout(reconnectTimerRef.current);
      wsRef.current?.close();
    };
  }, []);

  function handle(msg) {
    switch (msg.type) {

      case 'room_created':
        setMyName(msg.playerName);
        setRoomCode(msg.roomCode);
        setIsHost(true);
        setPhase('pregame');
        setFb({ msg:'', type:'' });
        break;

      case 'joined':
        setMyName(msg.playerName);
        setRoomCode(msg.roomCode);
        setIsHost(false);
        setPhase('pregame');
        setFb({ msg:'', type:'' });
        break;

      case 'pregame_update':
        setPregamePlayers(msg.players || []);
        setIsHost(msg.isHost || false);
        setHostName(msg.hostName || '');
        break;

      case 'game_starting':
        setPhase('lobby');
        setFb({ msg:'', type:'' });
        break;

      case 'lobby_update':
        setLobbyCount(msg.count);
        break;

      case 'back_to_lobby':
        setLobbyCount(msg.lobbyCount);
        setPhase('lobby');
        setResult(null);
        setFb({ msg:'', type:'' });
        break;

      case 'game_start':
        setMyObject(msg.object);
        setMyGameCode(msg.myCode);
        setOppLabel(msg.oppLabel);
        setOppMatched(false); setMyMatched(false);
        setVerifyInput(''); setAttemptsLeft(3);
        setTimeLeft(msg.timeLimit); setGameOn(true);
        setRound(r => r + 1);
        setFb({ msg:'', type:'' });
        setPhase('playing');
        break;

      case 'verify_fail':
        setAttemptsLeft(msg.attemptsLeft);
        const left = msg.attemptsLeft;
        if (left === 0)                      setFb({ msg:'💀 No attempts left!', type:'error' });
        else if (msg.reason==='wrong_code')  setFb({ msg:`❌ Wrong code! ${left} attempt${left!==1?'s':''} left.`, type:'error' });
        else if (msg.reason==='opp_matched') setFb({ msg:`❌ Already matched! ${left} left.`, type:'error' });
        else                                 setFb({ msg:`❌ Not your match! ${left} left.`, type:'error' });
        setVerifyInput('');
        break;

      case 'no_attempts':
        setFb({ msg:'💀 No attempts left!', type:'error' });
        break;

      case 'verify_ok':
        setMyMatched(true); setGameOn(false);
        setFb({ msg:'✅ MATCH FOUND!', type:'success' });
        break;

      case 'opp_matched':
        setOppMatched(true);
        break;

      case 'game_end':
        setGameOn(false); clearInterval(countRef.current); setRevealed(false);
        setResult({ matched:msg.matched, gift:msg.gift||null, myObject:msg.myObject, oppObject:msg.oppObject });
        setPhase('result');
        break;

      case 'join_error':
        setFb({ msg: msg.reason, type:'error' });
        break;

      case 'start_error':
        setFb({ msg: msg.reason, type:'error' });
        break;

      case 'error':
        setFb({ msg: msg.reason, type:'error' });
        break;

      case 'opp_left':
        setGameOn(false); clearInterval(countRef.current);
        setFb({ msg:'⚠️ Opponent left. Going back...', type:'error' });
        setTimeout(() => push({ type:'play_again' }), 2500);
        break;
    }
  }

  useEffect(() => {
    if (!gameOn || phase !== 'playing') return;
    countRef.current = setInterval(() => {
      setTimeLeft(t => t <= 1 ? (clearInterval(countRef.current), 0) : t - 1);
    }, 1000);
    return () => clearInterval(countRef.current);
  }, [gameOn, phase]);

  function push(data) {
    if (wsRef.current?.readyState === 1) wsRef.current.send(JSON.stringify(data));
  }

  function createRoom() {
    if (!nameInput.trim()) { setFb({ msg:'Please enter your name!', type:'error' }); return; }
    push({ type:'create_room', name: nameInput.trim() });
  }

  function joinRoom() {
    if (!nameInput.trim()) { setFb({ msg:'Please enter your name!', type:'error' }); return; }
    if (!codeInput.trim()) { setFb({ msg:'Please enter a room code!', type:'error' }); return; }
    push({ type:'join_room', name: nameInput.trim(), code: codeInput.trim() });
  }

  function startGame() { push({ type:'admin_start' }); }

  function verify() {
    if (verifyInput.length !== 6) { setFb({ msg:'❌ Enter a valid 6-digit code!', type:'error' }); return; }
    push({ type:'verify', code: verifyInput });
  }

  function copyRoomCode() {
    navigator.clipboard.writeText(roomCode).then(() => {
      setCodeCopied(true);
      setTimeout(() => setCodeCopied(false), 2000);
    });
  }

  function playAgain() { push({ type:'play_again' }); }
  function goHome()    { location.reload(); }

  // ── RECONNECTING ──────────────────────────────────────────────────────────
  if (phase === 'reconnecting') return (
    <div className="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
        <div className="text-5xl mb-4">🔄</div>
        <h2 className="text-xl font-black text-gray-800 mb-2">Connection dropped</h2>
        <p className="text-gray-500 text-sm mb-6">Reconnecting you to the game...</p>
        <div className="flex justify-center">
          <div className="dot d1"/><div className="dot d2"/><div className="dot d3"/>
        </div>
      </div>
    </div>
  );

  // ── ERROR ─────────────────────────────────────────────────────────────────
  if (phase === 'error') return (
    <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
        <div className="text-5xl mb-4">🔌</div>
        <h2 className="text-xl font-black text-gray-800 mb-2">Connection Lost</h2>
        <p className="text-gray-500 text-sm mb-6">{errMsg}</p>
        <button onClick={goHome} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Refresh</button>
      </div>
    </div>
  );

  // ── HOME ──────────────────────────────────────────────────────────────────
  if (phase === 'home') return (
    <div className="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md fade overflow-hidden">

        <div className="bg-gradient-to-r from-indigo-600 to-purple-600 px-8 pt-8 pb-6 text-center">
          <div className="text-5xl mb-2">🎯</div>
          <h1 className="text-3xl font-black text-white">Find Your Mate</h1>
          <p className="text-indigo-200 text-sm mt-1">Office Team Building · Live Multiplayer</p>
        </div>

        <div className="p-6">
          {/* Name field */}
          <label className="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Your Name</label>
          <input
            type="text"
            value={nameInput}
            onChange={e => setNameInput(e.target.value)}
            placeholder="Enter your name..."
            maxLength={20}
            className="w-full border-2 border-gray-100 focus:border-indigo-400 rounded-xl px-4 py-3 font-semibold text-gray-800 outline-none transition-colors mb-5"
          />

          {/* Tab switcher */}
          <div className="flex bg-gray-100 rounded-2xl p-1 mb-5">
            {[['create','👑 Create Room'],['join','🚪 Join Room']].map(([t,label]) => (
              <button key={t} onClick={() => { setHomeTab(t); setFb({msg:'',type:''}); }}
                className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all ${homeTab===t ? 'bg-white text-indigo-700 shadow' : 'text-gray-400 hover:text-gray-600'}`}>
                {label}
              </button>
            ))}
          </div>

          {/* Create tab */}
          {homeTab === 'create' && (
            <div className="fade">
              <div className="bg-indigo-50 rounded-2xl p-4 mb-5">
                <p className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2">As Host you can:</p>
                <ul className="space-y-1.5">
                  {['Create a private room with a unique code','Share the code with your team','Start the game when everyone is ready'].map((s,i) => (
                    <li key={i} className="flex gap-2 text-sm text-gray-600">
                      <span className="text-indigo-400 font-bold flex-shrink-0">✓</span>{s}
                    </li>
                  ))}
                </ul>
              </div>
              {fb.type === 'error' && <p className="text-red-500 text-sm mb-3 text-center">{fb.msg}</p>}
              <button onClick={createRoom}
                className="w-full bg-gradient-to-r from-indigo-600 to-purple-500 text-white font-black text-lg py-4 rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-lg">
                👑 Create Room
              </button>
            </div>
          )}

          {/* Join tab */}
          {homeTab === 'join' && (
            <div className="fade">
              <label className="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Room Code</label>
              <input
                type="text"
                value={codeInput}
                onChange={e => setCodeInput(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6))}
                onKeyDown={e => e.key === 'Enter' && joinRoom()}
                placeholder="XXXXXX"
                maxLength={6}
                className="w-full border-2 border-gray-100 focus:border-pink-400 rounded-xl px-4 py-3 font-black text-gray-800 text-center text-2xl tracking-[0.4em] outline-none transition-colors mb-5"
              />
              {fb.type === 'error' && <p className="text-red-500 text-sm mb-3 text-center">{fb.msg}</p>}
              <button onClick={joinRoom}
                className="w-full bg-gradient-to-r from-pink-500 to-orange-400 text-white font-black text-lg py-4 rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-lg">
                🚪 Join Room
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );

  // ── PRE-GAME WAITING ROOM ─────────────────────────────────────────────────
  if (phase === 'pregame') return (
    <div className="min-h-screen bg-gradient-to-br from-indigo-700 via-purple-700 to-blue-700 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md fade overflow-hidden">

        <div className="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 pt-6 pb-5 text-center">
          <div className="text-3xl mb-1">{isHost ? '👑' : '🏠'}</div>
          <h2 className="text-xl font-black text-white">Waiting Room</h2>
          <p className="text-indigo-200 text-sm mt-1">
            {isHost ? 'Share the code below — start when everyone is ready' : `Waiting for ${hostName} to start...`}
          </p>
        </div>

        <div className="p-6">
          {/* Room code display */}
          <div className="bg-indigo-50 border-2 border-indigo-100 rounded-2xl p-4 mb-5 text-center">
            <p className="text-xs font-black text-indigo-400 uppercase tracking-widest mb-1">Room Code</p>
            <p className="text-4xl font-black text-indigo-700 tracking-[0.4em] mb-3">{roomCode}</p>
            <div className="flex items-center justify-center gap-2 flex-wrap">
              <button onClick={copyRoomCode}
                className="text-xs font-bold px-4 py-2 rounded-xl transition-all"
                style={{ background: codeCopied ? '#d1fae5' : '#e0e7ff', color: codeCopied ? '#065f46' : '#4338ca' }}>
                {codeCopied ? '✓ Copied!' : '📋 Copy Code'}
              </button>
              <button onClick={() => {
                  const url = `${window.location.origin}/?join=${roomCode}`;
                  if (navigator.share) {
                    navigator.share({ title: 'Join my Find Your Mate game!', text: `Join my game with code ${roomCode}`, url });
                  } else {
                    navigator.clipboard.writeText(url).then(() => alert('Link copied to clipboard!'));
                  }
                }}
                className="text-xs font-bold px-4 py-2 rounded-xl transition-all"
                style={{ background: '#e0e7ff', color: '#4338ca' }}>
                🔗 Share Link
              </button>
            </div>
          </div>

          {/* Players list */}
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs font-black text-gray-400 uppercase tracking-widest">
              Players ({pregamePlayers.length})
            </p>
            {pregamePlayers.length >= 2 && pregamePlayers.length % 2 !== 0 && (
              <span className="text-xs text-amber-500 font-semibold">⚠️ Need even number</span>
            )}
            {pregamePlayers.length >= 2 && pregamePlayers.length % 2 === 0 && (
              <span className="text-xs text-green-500 font-semibold">✓ Ready to start</span>
            )}
          </div>

          <div className="space-y-2 mb-5 max-h-56 overflow-y-auto">
            {pregamePlayers.map((p, i) => (
              <div key={i} className="flex items-center gap-3 bg-gray-50 rounded-2xl px-4 py-3 slide-in">
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-black text-sm flex-shrink-0">
                  {p.name[0].toUpperCase()}
                </div>
                <span className="font-bold text-gray-800">{p.name}</span>
                <div className="ml-auto flex gap-1">
                  {p.name === myName   && <span className="text-xs text-indigo-400 font-semibold">(you)</span>}
                  {p.name === hostName && <span className="text-xs text-yellow-500 font-bold">👑</span>}
                </div>
              </div>
            ))}
            {pregamePlayers.length === 0 && (
              <p className="text-center text-gray-300 py-4 text-sm">No players yet...</p>
            )}
          </div>

          <div className="flex justify-center mb-4">
            <div className="dot d1"/><div className="dot d2"/><div className="dot d3"/>
          </div>

          {isHost ? (
            <div>
              {fb.msg && <p className={`text-sm text-center mb-3 ${fb.type==='error'?'text-red-500':'text-green-600'}`}>{fb.msg}</p>}
              <button onClick={startGame}
                disabled={pregamePlayers.length < 2 || pregamePlayers.length % 2 !== 0}
                className="w-full bg-gradient-to-r from-green-500 to-emerald-400 text-white font-black text-lg py-4 rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-lg disabled:opacity-40 disabled:cursor-not-allowed">
                {pregamePlayers.length < 2
                  ? '⏳ Waiting for players...'
                  : pregamePlayers.length % 2 !== 0
                  ? `⚠️ Need even number (${pregamePlayers.length} joined)`
                  : `🚀 Start Game (${pregamePlayers.length} players)`}
              </button>
            </div>
          ) : (
            <div className="bg-indigo-50 rounded-2xl p-4 text-center">
              <p className="text-indigo-600 font-semibold text-sm">
                ⏳ Waiting for <strong>{hostName}</strong> to start...
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );

  // ── PAIRING LOBBY ─────────────────────────────────────────────────────────
  if (phase === 'lobby') return (
    <div className="min-h-screen bg-gradient-to-br from-blue-700 via-purple-700 to-indigo-700 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md fade text-center">
        <div className="text-5xl mb-3">🔀</div>
        <h2 className="text-2xl font-black text-gray-800">Finding Your Match</h2>
        <p className="text-gray-400 text-sm mt-1 mb-6">Hold tight — pairing you now...</p>
        <div className="bg-gray-50 rounded-2xl p-4 mb-5">
          <p className="text-4xl font-black text-gray-800">{lobbyCount}</p>
          <p className="text-gray-500 text-sm">{lobbyCount === 1 ? 'player waiting' : 'players waiting to be paired'}</p>
        </div>
        <div className="flex justify-center">
          <div className="dot d1"/><div className="dot d2"/><div className="dot d3"/>
        </div>
      </div>
    </div>
  );

  // ── PLAYING ───────────────────────────────────────────────────────────────
  if (phase === 'playing' && myObject) {
    const critical = timeLeft <= 10, low = timeLeft <= 30;
    return (
      <div className="min-h-screen bg-gradient-to-br from-blue-600 via-purple-600 to-pink-500 p-4 pb-10">
        <div className="max-w-md mx-auto fade">

          <div className="bg-white/20 backdrop-blur rounded-2xl px-5 py-4 flex items-center justify-between mb-3">
            <div className="text-center">
              <p className="text-white/60 text-xs mb-0.5">{oppLabel}</p>
              <p className="text-white font-bold text-sm">{oppMatched ? '✅ Matched!' : '🎯 Searching...'}</p>
            </div>
            <div className="text-center">
              <p className="text-white/60 text-xs mb-1">⏱ TIME LEFT</p>
              <p className={`font-black text-5xl leading-none ${low?'text-red-300':'text-white'} ${critical?'blink':''}`}>{timeLeft}</p>
            </div>
            <div className="text-center">
              <p className="text-white/60 text-xs mb-0.5">{myName}</p>
              <p className="text-white font-bold text-sm">{myMatched ? '✅ Matched!' : '🎯 Find mate'}</p>
            </div>
          </div>

          <div className="bg-gradient-to-br from-blue-500 to-indigo-700 rounded-2xl p-6 mb-4 shadow-2xl">
            <p className="text-blue-200 text-xs font-bold uppercase tracking-widest text-center mb-5">🔒 Your Secret Object</p>
            <div className="text-center mb-5">
              <div className="text-8xl mb-2">{myObject.emoji}</div>
              <p className="text-white font-black text-2xl">{myObject.name}</p>
            </div>
            <div className="bg-white rounded-xl p-4 text-center">
              <p className="text-gray-400 text-xs font-semibold mb-1">🆔 YOUR CODE — share verbally</p>
              <p className="text-gray-800 font-black text-3xl tracking-[0.5em] font-mono">{myGameCode}</p>
              <p className="text-indigo-500 text-xs mt-2 font-medium">👉 Tell this to whoever finds you</p>
            </div>
          </div>

          {!myMatched && attemptsLeft > 0 && (
            <div className="bg-amber-50 border-l-4 border-amber-400 rounded-xl p-4 mb-4">
              <p className="text-amber-800 text-sm">🤝 Walk around, find who has your matching object, then ask for their 6-digit code!</p>
            </div>
          )}

          <div className="bg-white rounded-2xl p-5 mb-4 shadow-lg">
            <div className="flex items-center justify-between mb-3">
              <label className="text-sm font-bold text-gray-500">👤 Enter mate's code:</label>
              {!myMatched && (
                <div className="flex gap-1">
                  {[1,2,3].map(i => <span key={i} className={`text-lg ${i<=attemptsLeft?'opacity-100':'opacity-20 grayscale'}`}>❤️</span>)}
                </div>
              )}
            </div>
            <input
              type="tel" inputMode="numeric" maxLength={6}
              value={verifyInput}
              onChange={e => setVerifyInput(e.target.value.replace(/\D/g,'').slice(0,6))}
              onKeyDown={e => e.key === 'Enter' && verify()}
              placeholder="000000"
              disabled={myMatched || attemptsLeft === 0}
              className="w-full border-2 border-gray-200 focus:border-indigo-400 rounded-xl px-4 py-3 text-center text-2xl font-black tracking-[0.5em] font-mono outline-none transition-colors disabled:bg-gray-100 disabled:text-gray-400 mb-3"
            />
            <button onClick={verify} disabled={myMatched || attemptsLeft === 0}
              className={`w-full font-black text-lg py-4 rounded-xl transition-all ${
                myMatched ? 'bg-gray-100 text-gray-400 cursor-default' :
                attemptsLeft===0 ? 'bg-red-100 text-red-400 cursor-default' :
                'bg-gradient-to-r from-green-500 to-emerald-400 text-white hover:opacity-90 active:scale-95 shadow-lg'
              }`}>
              {myMatched ? '✓ MATCHED! Waiting...' : attemptsLeft===0 ? '💀 No Attempts Left' : '✓ VERIFY MATCH'}
            </button>
          </div>

          {fb.msg && (
            <div className={`rounded-xl p-4 text-center text-sm font-semibold fade ${fb.type==='success'?'bg-green-100 text-green-700':fb.type==='error'?'bg-red-100 text-red-600':'bg-white/20 text-white'}`}>
              {fb.msg}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ── RESULT ────────────────────────────────────────────────────────────────
  if (phase === 'result' && result) {
    if (!result.matched) return (
      <div className="min-h-screen bg-gradient-to-br from-slate-600 via-gray-700 to-slate-800 flex items-center justify-center p-4">
        <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md fade text-center">
          <div className="text-6xl mb-4">⌛</div>
          <h2 className="text-3xl font-black text-gray-700 mb-2">Time's Up!</h2>
          <p className="text-gray-400 text-sm mb-6">No match found. Try again!</p>
          <div className="bg-gray-50 rounded-2xl p-4 mb-6 flex items-center justify-around">
            <div className="text-center"><div className="text-4xl">{result.myObject?.emoji}</div><p className="text-xs text-gray-400 mt-1">{result.myObject?.name}</p></div>
            <div className="text-2xl text-gray-200">↔</div>
            <div className="text-center"><div className="text-4xl">{result.oppObject?.emoji}</div><p className="text-xs text-gray-400 mt-1">{result.oppObject?.name}</p></div>
          </div>
          <div className="flex gap-3">
            <button onClick={playAgain} className="flex-1 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-black py-4 rounded-xl hover:opacity-90 active:scale-95 shadow-lg">TRY AGAIN</button>
            <button onClick={goHome}    className="flex-1 bg-gray-100 text-gray-500 font-bold py-4 rounded-xl">HOME</button>
          </div>
        </div>
      </div>
    );

    return (
      <div className="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-orange-400 flex items-center justify-center p-4">
        <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md fade">
          <div className="text-center mb-6">
            <div className="text-5xl mb-2">🎉</div>
            <h2 className="text-3xl font-black text-gray-800">You Matched!</h2>
            <p className="text-gray-400 text-sm mt-1">You and <span className="font-bold text-purple-500">{oppLabel}</span> are a pair!</p>
          </div>
          <div className="bg-purple-50 rounded-2xl p-4 mb-6 flex items-center justify-around">
            <div className="text-center"><div className="text-4xl">{result.myObject?.emoji}</div><p className="text-xs text-gray-400 mt-1">Your Object</p><p className="font-bold text-gray-700 text-sm">{result.myObject?.name}</p></div>
            <div className="text-2xl text-purple-200 font-black">↔</div>
            <div className="text-center"><div className="text-4xl">{result.oppObject?.emoji}</div><p className="text-xs text-gray-400 mt-1">{oppLabel}'s Object</p><p className="font-bold text-gray-700 text-sm">{result.oppObject?.name}</p></div>
          </div>
          <div className="bg-gradient-to-br from-yellow-50 to-orange-50 border-2 border-yellow-200 rounded-2xl p-6 mb-6 text-center">
            <p className="text-xs font-bold text-orange-400 uppercase tracking-widest mb-4">🎁 Your Surprise Gift</p>
            {!revealed ? (
              <div onClick={() => setRevealed(true)} className="cursor-pointer select-none">
                <div className="text-8xl mb-3 shake inline-block">🎁</div>
                <p className="text-gray-600 font-bold text-sm">Tap to reveal!</p>
              </div>
            ) : (
              <div className="pop">
                <div className="text-8xl mb-3 float inline-block">{result.gift?.emoji}</div>
                <h3 className="text-2xl font-black text-gray-800 mb-1">{result.gift?.label}</h3>
                <p className="text-gray-500 text-sm">{result.gift?.desc}</p>
              </div>
            )}
          </div>
          <div className="flex gap-3">
            <button onClick={playAgain} className="flex-1 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-black py-4 rounded-xl hover:opacity-90 active:scale-95 shadow-lg">PLAY AGAIN</button>
            <button onClick={goHome}    className="flex-1 bg-gray-100 text-gray-500 font-bold py-4 rounded-xl">HOME</button>
          </div>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
