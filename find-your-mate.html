<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Mate 🎯</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bounce-dot {
      0%,80%,100% { transform:translateY(0); }
      40%          { transform:translateY(-10px); }
    }
    @keyframes pulse-timer {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.45; transform:scale(0.93); }
    }
    @keyframes fade-in {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes shake {
      0%,100% { transform:rotate(0deg) scale(1); }
      15%     { transform:rotate(-8deg) scale(1.05); }
      30%     { transform:rotate(8deg) scale(1.05); }
      45%     { transform:rotate(-6deg) scale(1.05); }
      60%     { transform:rotate(6deg) scale(1.05); }
      75%     { transform:rotate(-4deg) scale(1.02); }
    }
    @keyframes pop {
      0%  { transform:scale(0) rotate(-10deg); opacity:0; }
      65% { transform:scale(1.15) rotate(3deg); opacity:1; }
      100%{ transform:scale(1) rotate(0deg); opacity:1; }
    }
    @keyframes float {
      0%,100% { transform:translateY(0px); }
      50%     { transform:translateY(-8px); }
    }
    @keyframes slide-in {
      from { opacity:0; transform:translateX(-12px); }
      to   { opacity:1; transform:translateX(0); }
    }
    .dot      { width:10px;height:10px;border-radius:50%;background:#a78bfa;display:inline-block;margin:0 3px; }
    .d1       { animation:bounce-dot 1.2s ease-in-out 0.0s infinite; }
    .d2       { animation:bounce-dot 1.2s ease-in-out 0.2s infinite; }
    .d3       { animation:bounce-dot 1.2s ease-in-out 0.4s infinite; }
    .blink    { animation:pulse-timer 0.65s ease-in-out infinite; }
    .fade     { animation:fade-in 0.35s ease; }
    .shake    { animation:shake 1.2s ease-in-out infinite; }
    .pop      { animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .float    { animation:float 2s ease-in-out infinite; }
    .slide-in { animation:slide-in 0.3s ease; }
    *         { -webkit-tap-highlight-color:transparent; }
  </style>
</head>
<body class="bg-gray-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [phase,        setPhase       ] = useState('home');
  const [nameInput,    setNameInput   ] = useState('');
  const [myLabel,      setMyLabel     ] = useState('');
  const [isHost,       setIsHost      ] = useState(false);
  const [pregamePlayers, setPregamePlayers] = useState([]);
  const [hostName,     setHostName    ] = useState('');
  const [lobbyCount,   setLobbyCount  ] = useState(0);

  const [myObject,     setMyObject    ] = useState(null);
  const [myCode,       setMyCode      ] = useState('');
  const [oppLabel,     setOppLabel    ] = useState('');
  const [oppMatched,   setOppMatched  ] = useState(false);
  const [myMatched,    setMyMatched   ] = useState(false);
  const [codeInput,    setCodeInput   ] = useState('');
  const [timeLeft,     setTimeLeft    ] = useState(120);
  const [gameOn,       setGameOn      ] = useState(false);
  const [round,        setRound       ] = useState(0);

  const [result,       setResult      ] = useState(null);
  const [revealed,     setRevealed    ] = useState(false);
  const [attemptsLeft, setAttemptsLeft] = useState(3);
  const [fb,           setFb          ] = useState({ msg:'', type:'' });
  const [errMsg,       setErrMsg      ] = useState('');

  const wsRef    = useRef(null);
  const countRef = useRef(null);

  useEffect(() => {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws    = new WebSocket(`${proto}://${location.host}`);
    wsRef.current = ws;
    ws.onopen  = () => console.log('connected');
    ws.onclose = () => { setPhase(p => p === 'home' ? 'home' : 'error'); setErrMsg('Connection lost. Please refresh.'); };
    ws.onerror = () => { setPhase('error'); setErrMsg('Could not connect. Please refresh.'); };
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    return () => ws.close();
  }, []);

  function handle(msg) {
    switch (msg.type) {

      case 'joined':
        setMyLabel(msg.playerLabel);
        setIsHost(msg.isHost || false);
        setPhase('pregame');
        setFb({ msg:'', type:'' });
        break;

      case 'pregame_update':
        setPregamePlayers(msg.players || []);
        setIsHost(msg.isHost || false);
        setHostName(msg.hostName || '');
        break;

      case 'game_starting':
        setFb({ msg:'🚀 Game is starting!', type:'success' });
        setPhase('lobby');
        break;

      case 'lobby_update':
        setLobbyCount(msg.count);
        break;

      case 'back_to_lobby':
        setLobbyCount(msg.lobbyCount);
        setPhase('lobby');
        setResult(null);
        setFb({ msg:'', type:'' });
        break;

      case 'game_start':
        setMyObject(msg.object);
        setMyCode(msg.myCode);
        setOppLabel(msg.oppLabel);
        setOppMatched(false);
        setMyMatched(false);
        setCodeInput('');
        setAttemptsLeft(3);
        setTimeLeft(msg.timeLimit);
        setGameOn(true);
        setRound(r => r + 1);
        setFb({ msg:'🎮 Game started! Find your mate!', type:'' });
        setPhase('playing');
        break;

      case 'verify_fail':
        setAttemptsLeft(msg.attemptsLeft);
        if (msg.attemptsLeft === 0)          setFb({ msg:'💀 No attempts left!', type:'error' });
        else if (msg.reason === 'wrong_code') setFb({ msg:`❌ Wrong code! ${msg.attemptsLeft} left.`, type:'error' });
        else if (msg.reason === 'opp_matched')setFb({ msg:`❌ Already matched! ${msg.attemptsLeft} left.`, type:'error' });
        else if (msg.reason === 'wrong_object')setFb({ msg:`❌ Not your match! ${msg.attemptsLeft} left.`, type:'error' });
        setCodeInput('');
        break;

      case 'no_attempts':
        setFb({ msg:'💀 No attempts left!', type:'error' });
        break;

      case 'verify_ok':
        setMyMatched(true);
        setGameOn(false);
        setFb({ msg:'✅ MATCH FOUND! Opening your surprise...', type:'success' });
        break;

      case 'opp_matched':
        setOppMatched(true);
        break;

      case 'game_end':
        setGameOn(false);
        clearInterval(countRef.current);
        setRevealed(false);
        setResult({ matched:msg.matched, gift:msg.gift||null, myObject:msg.myObject, oppObject:msg.oppObject });
        setPhase('result');
        break;

      case 'start_error':
        setFb({ msg:`⚠️ ${msg.reason}`, type:'error' });
        break;

      case 'room_full':
        setPhase('error');
        setErrMsg(`Room is full (max ${msg.max}). Try again later.`);
        break;

      case 'opp_left':
        setGameOn(false);
        clearInterval(countRef.current);
        setFb({ msg:'⚠️ Opponent disconnected. Going back...', type:'error' });
        setTimeout(() => push({ type:'play_again' }), 2500);
        break;
    }
  }

  useEffect(() => {
    if (!gameOn || phase !== 'playing') return;
    countRef.current = setInterval(() => {
      setTimeLeft(t => (t <= 1 ? (clearInterval(countRef.current), 0) : t - 1));
    }, 1000);
    return () => clearInterval(countRef.current);
  }, [gameOn, phase]);

  function push(data) {
    if (wsRef.current?.readyState === 1) wsRef.current.send(JSON.stringify(data));
  }

  function joinLobby() {
    if (!nameInput.trim()) { setFb({ msg:'Please enter your name!', type:'error' }); return; }
    push({ type:'join', name: nameInput.trim() });
  }

  function startGame() { push({ type:'admin_start' }); }
  function verify()    {
    if (!codeInput || codeInput.length !== 6) { setFb({ msg:'❌ Enter a valid 6-digit code!', type:'error' }); return; }
    push({ type:'verify', code: codeInput });
  }
  function playAgain() { push({ type:'play_again' }); }
  function goHome()    { location.reload(); }

  // ── ERROR ─────────────────────────────────────────────────────────────────
  if (phase === 'error') return (
    <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
        <div className="text-5xl mb-4">🔌</div>
        <h2 className="text-xl font-black text-gray-800 mb-2">Connection Lost</h2>
        <p className="text-gray-500 text-sm mb-6">{errMsg}</p>
        <button onClick={goHome} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Refresh & Reconnect</button>
      </div>
    </div>
  );

  // ── HOME ──────────────────────────────────────────────────────────────────
  if (phase === 'home') return (
    <div className="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md fade">
        <div className="text-center mb-7">
          <div className="text-6xl mb-3">🎯</div>
          <h1 className="text-3xl font-black text-gray-800">Find Your Mate</h1>
          <p className="text-gray-400 text-sm mt-1">Office Team Building · Live Multiplayer</p>
        </div>

        <div className="bg-indigo-50 rounded-2xl p-4 mb-6">
          <p className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-3">How it works</p>
          {[
            'Everyone opens this link on their phone',
            'Enter your name and join the waiting room',
            'The host starts the game when everyone is ready',
            'You\'ll be secretly paired with someone',
            'Walk around, find who has your matching object',
            'Ask for their 6-digit code to verify — winner gets a prize!',
          ].map((s,i) => (
            <div key={i} className="flex gap-2 items-start mb-2 last:mb-0">
              <span className="flex-shrink-0 w-5 h-5 rounded-full bg-indigo-200 text-indigo-700 text-xs font-bold flex items-center justify-center mt-0.5">{i+1}</span>
              <span className="text-gray-600 text-sm leading-snug">{s}</span>
            </div>
          ))}
        </div>

        <label className="block text-sm font-semibold text-gray-500 mb-1">Your Name</label>
        <input
          type="text"
          value={nameInput}
          onChange={e => setNameInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && joinLobby()}
          placeholder="Enter your name..."
          maxLength={20}
          className="w-full border-2 border-gray-200 focus:border-indigo-400 rounded-xl px-4 py-3 font-medium text-gray-800 outline-none transition-colors mb-3"
        />
        {fb.type === 'error' && <p className="text-red-500 text-sm mb-3">{fb.msg}</p>}

        <button onClick={joinLobby}
          className="w-full bg-gradient-to-r from-indigo-600 to-purple-500 text-white font-black text-lg py-4 rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-lg">
          JOIN THE ROOM →
        </button>
      </div>
    </div>
  );

  // ── PRE-GAME LOBBY ────────────────────────────────────────────────────────
  if (phase === 'pregame') return (
    <div className="min-h-screen bg-gradient-to-br from-indigo-700 via-purple-700 to-blue-700 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md fade overflow-hidden">
        {/* Header */}
        <div className="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 pt-6 pb-5 text-center">
          <div className="text-4xl mb-2">🏠</div>
          <h2 className="text-2xl font-black text-white">Waiting Room</h2>
          <p className="text-indigo-200 text-sm mt-1">
            {isHost ? '👑 You are the host — start when everyone is ready' : `Waiting for ${hostName || 'the host'} to start...`}
          </p>
        </div>

        <div className="p-6">
          {/* Player count */}
          <div className="flex items-center justify-between mb-4">
            <p className="text-xs font-black text-gray-400 uppercase tracking-widest">
              Players Joined ({pregamePlayers.length})
            </p>
            {pregamePlayers.length < 2 && (
              <span className="text-xs text-amber-500 font-semibold">Need at least 2</span>
            )}
          </div>

          {/* Player list */}
          <div className="space-y-2 mb-6 max-h-64 overflow-y-auto">
            {pregamePlayers.map((p, i) => (
              <div key={i} className="flex items-center gap-3 bg-gray-50 rounded-2xl px-4 py-3 slide-in">
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-black text-sm flex-shrink-0">
                  {p.name[0].toUpperCase()}
                </div>
                <span className="font-bold text-gray-800">{p.name}</span>
                {p.name === myLabel && <span className="text-xs text-indigo-400 font-semibold ml-auto">(you)</span>}
                {p.name === hostName && <span className="text-xs text-yellow-500 font-bold ml-auto">👑 Host</span>}
              </div>
            ))}
            {pregamePlayers.length === 0 && (
              <p className="text-center text-gray-300 py-4 text-sm">Waiting for players...</p>
            )}
          </div>

          {/* Animated dots */}
          <div className="flex justify-center mb-5">
            <div className="dot d1"/><div className="dot d2"/><div className="dot d3"/>
          </div>

          {/* Host: Start button | Others: waiting message */}
          {isHost ? (
            <div>
              {fb.type === 'error' && <p className="text-red-500 text-sm text-center mb-3">{fb.msg}</p>}
              <button
                onClick={startGame}
                disabled={pregamePlayers.length < 2}
                className="w-full bg-gradient-to-r from-green-500 to-emerald-400 text-white font-black text-lg py-4 rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-lg disabled:opacity-40 disabled:cursor-not-allowed"
              >
                {pregamePlayers.length < 2 ? '⏳ Waiting for more players...' : `🚀 Start Game (${pregamePlayers.length} players)`}
              </button>
            </div>
          ) : (
            <div className="bg-indigo-50 rounded-2xl p-4 text-center">
              <p className="text-indigo-600 font-semibold text-sm">
                ⏳ Waiting for <strong>{hostName}</strong> to start the game...
              </p>
            </div>
          )}

          <p className="text-center text-gray-400 text-xs mt-4">
            Share this page link with your team so everyone can join.
          </p>
        </div>
      </div>
    </div>
  );

  // ── PAIRING LOBBY (game active, waiting to be paired) ─────────────────────
  if (phase === 'lobby') return (
    <div className="min-h-screen bg-gradient-to-br from-blue-700 via-purple-700 to-indigo-700 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md fade">
        <div className="text-center mb-6">
          <div className="text-5xl mb-3">🔀</div>
          <h2 className="text-2xl font-black text-gray-800">Finding Your Match</h2>
          <p className="text-gray-400 text-sm mt-1">Hold tight — pairing you now...</p>
        </div>

        <div className="bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-4 mb-5 text-center">
          <p className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-1">You are</p>
          <p className="text-3xl font-black text-indigo-600">{myLabel}</p>
        </div>

        <div className="bg-gray-50 rounded-2xl p-4 mb-5 text-center">
          <p className="text-4xl font-black text-gray-800">{lobbyCount}</p>
          <p className="text-gray-500 text-sm">{lobbyCount === 1 ? 'player waiting' : 'players waiting to be paired'}</p>
        </div>

        <div className="flex justify-center mb-5">
          <div className="dot d1"/><div className="dot d2"/><div className="dot d3"/>
        </div>
      </div>
    </div>
  );

  // ── PLAYING ───────────────────────────────────────────────────────────────
  if (phase === 'playing' && myObject) {
    const critical = timeLeft <= 10;
    const low      = timeLeft <= 30;
    return (
      <div className="min-h-screen bg-gradient-to-br from-blue-600 via-purple-600 to-pink-500 p-4 pb-10">
        <div className="max-w-md mx-auto fade">

          <div className="bg-white/20 backdrop-blur rounded-2xl px-5 py-4 flex items-center justify-between mb-3">
            <div className="text-center">
              <p className="text-white/60 text-xs mb-0.5">{oppLabel}</p>
              <p className="text-white font-bold text-sm">{oppMatched ? '✅ Matched!' : '🎯 Searching...'}</p>
            </div>
            <div className="text-center">
              <p className="text-white/60 text-xs mb-1">⏱ TIME LEFT</p>
              <p className={`font-black text-5xl leading-none ${low ? 'text-red-300' : 'text-white'} ${critical ? 'blink' : ''}`}>
                {timeLeft}
              </p>
            </div>
            <div className="text-center">
              <p className="text-white/60 text-xs mb-0.5">{myLabel}</p>
              <p className="text-white font-bold text-sm">{myMatched ? '✅ Matched!' : '🎯 Find mate'}</p>
            </div>
          </div>

          <div className="flex justify-between px-1 mb-3">
            <span className="text-white/50 text-xs">Round {round}</span>
          </div>

          <div className="bg-gradient-to-br from-blue-500 to-indigo-700 rounded-2xl p-6 mb-4 shadow-2xl">
            <p className="text-blue-200 text-xs font-bold uppercase tracking-widest text-center mb-5">🔒 Your Secret Object</p>
            <div className="text-center mb-5">
              <div className="text-8xl mb-2">{myObject.emoji}</div>
              <p className="text-white font-black text-2xl">{myObject.name}</p>
            </div>
            <div className="bg-white rounded-xl p-4 text-center mb-4">
              <p className="text-gray-400 text-xs font-semibold mb-1">🆔 YOUR CODE — share verbally</p>
              <p className="text-gray-800 font-black text-3xl tracking-[0.5em] font-mono">{myCode}</p>
              <p className="text-indigo-500 text-xs mt-2 font-medium">👉 When someone finds you, tell them this code</p>
            </div>
          </div>

          {!myMatched && attemptsLeft > 0 && (
            <div className="bg-amber-50 border-l-4 border-amber-400 rounded-xl p-4 mb-4">
              <p className="text-amber-800 text-sm">
                🤝 <strong>Walk around, talk to people</strong> and figure out who matches with you — then ask for their 6-digit code!
              </p>
            </div>
          )}

          <div className="bg-white rounded-2xl p-5 mb-4 shadow-lg">
            <div className="flex items-center justify-between mb-3">
              <label className="text-sm font-bold text-gray-500">👤 Enter your mate's code:</label>
              {!myMatched && (
                <div className="flex items-center gap-1">
                  {[1,2,3].map(i => (
                    <span key={i} className={`text-lg transition-all ${i <= attemptsLeft ? 'opacity-100' : 'opacity-20 grayscale'}`}>❤️</span>
                  ))}
                </div>
              )}
            </div>
            <input
              type="tel"
              inputMode="numeric"
              maxLength={6}
              value={codeInput}
              onChange={e => setCodeInput(e.target.value.replace(/\D/g,'').slice(0,6))}
              onKeyDown={e => e.key === 'Enter' && verify()}
              placeholder="000000"
              disabled={myMatched || attemptsLeft === 0}
              className="w-full border-2 border-gray-200 focus:border-indigo-400 rounded-xl px-4 py-3 text-center text-2xl font-black tracking-[0.5em] font-mono outline-none transition-colors disabled:bg-gray-100 disabled:text-gray-400 mb-3"
            />
            <button onClick={verify} disabled={myMatched || attemptsLeft === 0}
              className={`w-full font-black text-lg py-4 rounded-xl transition-all ${
                myMatched        ? 'bg-gray-100 text-gray-400 cursor-default' :
                attemptsLeft===0 ? 'bg-red-100 text-red-400 cursor-default' :
                                   'bg-gradient-to-r from-green-500 to-emerald-400 text-white hover:opacity-90 active:scale-95 shadow-lg'
              }`}>
              {myMatched ? '✓ MATCHED! Waiting...' : attemptsLeft===0 ? '💀 No Attempts Left' : '✓ VERIFY MATCH'}
            </button>
          </div>

          {fb.msg && (
            <div className={`rounded-xl p-4 text-center text-sm font-semibold fade ${
              fb.type==='success' ? 'bg-green-100 text-green-700' :
              fb.type==='error'   ? 'bg-red-100 text-red-600'    :
                                    'bg-white/20 text-white'
            }`}>{fb.msg}</div>
          )}
        </div>
      </div>
    );
  }

  // ── RESULT ────────────────────────────────────────────────────────────────
  if (phase === 'result' && result) {
    if (!result.matched) return (
      <div className="min-h-screen bg-gradient-to-br from-slate-600 via-gray-700 to-slate-800 flex items-center justify-center p-4">
        <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md fade text-center">
          <div className="text-6xl mb-4">⌛</div>
          <h2 className="text-3xl font-black text-gray-700 mb-2">Time's Up!</h2>
          <p className="text-gray-400 text-sm mb-6">No match found in time. Try again!</p>
          <div className="bg-gray-50 rounded-2xl p-4 mb-6 flex items-center justify-around">
            <div className="text-center">
              <div className="text-4xl">{result.myObject?.emoji}</div>
              <p className="text-xs text-gray-400 mt-1 font-medium">{result.myObject?.name}</p>
            </div>
            <div className="text-2xl text-gray-200">↔</div>
            <div className="text-center">
              <div className="text-4xl">{result.oppObject?.emoji}</div>
              <p className="text-xs text-gray-400 mt-1 font-medium">{result.oppObject?.name}</p>
            </div>
          </div>
          <div className="flex gap-3">
            <button onClick={playAgain} className="flex-1 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-black py-4 rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-lg">TRY AGAIN</button>
            <button onClick={goHome}    className="flex-1 bg-gray-100 text-gray-500 font-bold py-4 rounded-xl hover:bg-gray-200 transition-colors">HOME</button>
          </div>
        </div>
      </div>
    );

    return (
      <div className="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-orange-400 flex items-center justify-center p-4">
        <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md fade">
          <div className="text-center mb-6">
            <div className="text-5xl mb-2">🎉</div>
            <h2 className="text-3xl font-black text-gray-800">You Matched!</h2>
            <p className="text-gray-400 text-sm mt-1">
              You and <span className="font-bold text-purple-500">{oppLabel}</span> are a pair!
            </p>
          </div>

          <div className="bg-purple-50 rounded-2xl p-4 mb-6 flex items-center justify-around">
            <div className="text-center">
              <div className="text-4xl">{result.myObject?.emoji}</div>
              <p className="text-xs text-gray-400 mt-1">Your Object</p>
              <p className="font-bold text-gray-700 text-sm">{result.myObject?.name}</p>
            </div>
            <div className="text-2xl text-purple-200 font-black">↔</div>
            <div className="text-center">
              <div className="text-4xl">{result.oppObject?.emoji}</div>
              <p className="text-xs text-gray-400 mt-1">{oppLabel}'s Object</p>
              <p className="font-bold text-gray-700 text-sm">{result.oppObject?.name}</p>
            </div>
          </div>

          <div className="bg-gradient-to-br from-yellow-50 to-orange-50 border-2 border-yellow-200 rounded-2xl p-6 mb-6 text-center">
            <p className="text-xs font-bold text-orange-400 uppercase tracking-widest mb-4">🎁 Your Surprise Gift</p>
            {!revealed ? (
              <div onClick={() => setRevealed(true)} className="cursor-pointer select-none">
                <div className="text-8xl mb-3 shake inline-block">🎁</div>
                <p className="text-gray-600 font-bold text-sm">Tap the box to reveal!</p>
              </div>
            ) : (
              <div className="pop">
                <div className="text-8xl mb-3 float inline-block">{result.gift?.emoji}</div>
                <h3 className="text-2xl font-black text-gray-800 mb-1">{result.gift?.label}</h3>
                <p className="text-gray-500 text-sm">{result.gift?.desc}</p>
              </div>
            )}
          </div>

          <div className="flex gap-3">
            <button onClick={playAgain} className="flex-1 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-black py-4 rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-lg">PLAY AGAIN</button>
            <button onClick={goHome}    className="flex-1 bg-gray-100 text-gray-500 font-bold py-4 rounded-xl hover:bg-gray-200 transition-colors">HOME</button>
          </div>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
